name: generate animation

on:
  # L'animation se met à jour toutes les heures
  schedule:
    - cron: "0 * * * *"
  
  # Permet de lancer l'animation manuellement
  workflow_dispatch:
  
  # Se lance à chaque fois que tu pousses du code sur la branche main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Génère le serpent à partir de tes contributions
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: fjjjuv
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pousse le fichier généré sur une branche appelée "output"
      - name: publish snake as fjjjuv
        run: |
          git config user.name "fjjjuv"
          git config user.email "fjjjuv@users.noreply.github.com"
          mv dist /tmp/profile-snake
          git fetch origin output
          git checkout -B output origin/output
          git rm -rf .
          cp -R /tmp/profile-snake/. .
          if git diff --quiet -- . && [ -z "$(git status --short)" ]; then
            echo "Contribution snake is already current."
            exit 0
          fi
          git add .
          git commit -m "chore: refresh contribution snake"
          git push origin output
