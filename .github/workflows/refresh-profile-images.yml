name: refresh profile images

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Refresh image cache keys
        run: |
          today="$(date -u +%Y%m%d)"
          sed -E -i "s/v=[0-9]{8}/v=${today}/g" README.md

      - name: Commit refreshed image URLs
        run: |
          if git diff --quiet -- README.md; then
            echo "Image URLs are already current."
            exit 0
          fi

          git config user.name "fjjjuv"
          git config user.email "fjjjuv@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile image caches"
          git push
